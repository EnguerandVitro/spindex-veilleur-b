# SPINDEX — veilleur, instance « b », sur une infrastructure indépendante de la machine du keeper.
#
# La décision du 2026-09-21 exige DEUX veilleurs, le second sur un autre fournisseur et un autre
# compte. L'instance « a » tourne sur la machine du keeper : si cette machine tombe ou est compromise,
# le témoin tombe avec elle. Ce job est le témoin qui ne tombe pas avec elle.
#
# Ce que ce montage NE protège PAS est écrit dans le README, en tête. Le lire d'abord.
#
# ------------------------------------------------------------------------------------ la cadence
# `schedule` de GitHub Actions ne descend pas sous 5 minutes, et ses exécutions sont au MIEUX
# approximatives : GitHub annonce lui-même des retards, et des passages SAUTÉS en période de charge.
# Un `*/5` ne serait donc pas « toutes les 5 minutes », ce serait « toutes les 5 à 25 minutes ».
#
# `*/15`, et voici pourquoi c'est le bon choix plutôt qu'un compromis :
#   — ce que `b` doit garantir n'est PAS la règle des 5 minutes de publication d'une table. Celle-là
#     appartient à `a`, sous systemd, sur une machine que nous tenons, avec un timer qui tient
#     réellement ses 5 minutes. `b` garantit qu'un silence ou un mensonge de `a` se VOIE ;
#   — l'échelle des choses que `b` doit voir est la semaine (`postWeek`), et les échéances du contrat
#     sont à J+30 et J+90. Un quart d'heure est sans commune mesure avec ces bornes ;
#   — `*/15` donne trois fois plus de marge face aux retards de la plateforme, et divise par trois la
#     charge RPC d'un veilleur qui n'a pas de nœud à lui.
#
# ⚠️ NON RÉSOLU ICI, et pas résoluble ici : le `health.json` que `b` publie est écrit par le paquet
# SCELLÉ, dont `battement.TACHES["passe"]["période_s"]` vaut 300 s en dur (la cadence du timer
# systemd). La surveillance en dérive `silence_max_s ≈ 431 s` et déclarera `b` MUET à chaque passage.
# Voir `DEMANDE-SURVEILLANCE.md`, point 3.
#
# ------------------------------------------------------------------------- ce que le job publie
# Les deux, et chacun pour une raison différente :
#   — un ARTEFACT, attaché à l'exécution : il survit à un échec de poussée, il porte les journaux
#     bruts, et il est là même quand la branche ne l'est pas. Il expire (90 jours) et il faut un
#     compte pour le lire : il ne peut donc pas être le canal de la surveillance. C'est le FILET ;
#   — un COMMIT sur la branche `attestations` : permanent, horodaté par GitHub, lisible par un simple
#     `git fetch` depuis n'importe où, sans compte ni jeton si le dépôt est public. C'est le CANAL.
#
# ------------------------------------------------------------------------------- l'échec du job
# Le paquet scellé sort 0 quand une passe a fait son travail, MÊME si elle a trouvé une P0 : c'est
# juste pour un service surveillé en continu, faux ici, où le seul signal que quelqu'un regarde est
# la croix rouge. `outils/juger.py` traduit, et la barrière finale fait échouer le job — APRÈS avoir
# publié, jamais avant (un veilleur qui se tait quand il trouve quelque chose est pire qu'absent).

name: sonde3

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      tache:
        description: "Tâche à exécuter"
        type: choice
        default: passe
        options: [passe, differentiel-quotidien, differentiel-complet]

# Jamais deux exécutions en parallèle : elles se disputeraient la branche et, pire, le compteur de
# passe (qui doit être strictement croissant) et le verrou du cache des journaux.
concurrency:
  group: veilleur-b
  cancel-in-progress: false

permissions:
  contents: write        # pousser la branche `attestations`. Rien d'autre.

jobs:
  veiller:
    runs-on: ubuntu-24.04
    timeout-minutes: 45          # un amorçage à froid relit toute la chaîne ; une passe tiède dure quelques secondes
    steps:
      - name: Dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true   # la poussée de `attestations` réutilise cet accès

      - name: Dépendances épinglées
        # Python 3.12 est celui du runner ubuntu-24.04 : pas d'action tierce de plus pour l'installer.
        # `--require-hashes` : une roue substituée est refusée. `--no-deps` : rien qui ne soit écrit
        # dans requirements.txt n'est installé.
        run: |
          python3 -VV
          python3 -m pip install --user --no-deps --require-hashes -r requirements.txt
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Restaurer l'état depuis la branche `attestations`
        # Une seule branche de données, et elle n'est jamais réécrite : c'est ce qui permet de
        # constater après coup qu'un lot a été publié — ou qu'il manque. L'état de travail (cache des
        # journaux compris) y vit aussi : le perdre ne serait pas grave (il se reconstruit depuis la
        # chaîne) mais ce serait long, et le registre d'amorçage, lui, est l'ancre de chaîne.
        run: |
          bash outils/branche.sh attestations publication
          mkdir -p travail/etat
          if [ -d publication/etat ]; then
            cp -r publication/etat/. travail/etat/
            echo "état restauré :"; ls -la travail/etat
          else
            echo "aucun état dans la branche : premier passage, le job va amorcer depuis la chaîne"
          fi

      - name: Veiller
        id: veille
        continue-on-error: true       # la publication doit avoir lieu même quand le jugement est ROUGE
        env:
          B_ETAT: ${{ github.workspace }}/travail
          B_LOT: ${{ github.workspace }}/lot
          B_TACHE: ${{ inputs.tache || 'passe' }}
          B_CONFIG: ${{ github.workspace }}/config/chaine-46630.json
          SPINDEX_B_RPC_URL: ${{ secrets.SPINDEX_B_RPC_URL }}
          SPINDEX_B_ATTEST_KEY_HEX: ${{ secrets.SPINDEX_B_ATTEST_KEY_HEX }}
        run: bash outils/executer.sh

      - name: Artefact (filet, même en échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilleur-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: lot
          if-no-files-found: warn
          retention-days: 90

      - name: Publier sur la branche `attestations`
        if: always()
        run: |
          set -e
          if [ ! -f lot/MANIFESTE.json ]; then
            echo "::warning title=veilleur b::aucun lot signé à publier — le montage lui-même a refusé de démarrer, rien n'a été lu sur la chaîne"
            exit 0
          fi
          VERDICT="$(python3 -B -c 'import json;print(json.load(open("lot/JUGEMENT.json",encoding="utf-8"))["verdict"])')"
          HORO="$(date -u +%Y%m%dT%H%M%SZ)"
          JOUR="${HORO%%T*}"

          # `courant/` : le dernier lot, à un chemin STABLE. C'est ce que la surveillance lit.
          rm -rf publication/courant && mkdir -p publication/courant
          cp -r lot/. publication/courant/

          # `lots/` : l'histoire. On n'archive PAS les 96 passages verts d'une journée — la branche
          # grossirait pour rien. On archive ce qui compte : tout rouge, tout lot portant un verdict
          # de feu vert, et un lot par jour pour prouver que la chaîne des jours n'a pas de trou.
          ARCHIVER=non
          [ "$VERDICT" = "ROUGE" ] && ARCHIVER=oui
          [ -d lot/verdicts ] && ARCHIVER=oui
          ls -d publication/lots/"$JOUR"T* >/dev/null 2>&1 || ARCHIVER=oui
          if [ "$ARCHIVER" = "oui" ]; then
            mkdir -p "publication/lots/$HORO-${GITHUB_RUN_ID}"
            cp -r lot/. "publication/lots/$HORO-${GITHUB_RUN_ID}/"
          fi

          # l'état de travail, pour l'exécution suivante
          rm -rf publication/etat && mkdir -p publication/etat
          cp -r travail/etat/. publication/etat/
          # le vérificateur voyage avec les lots : un lecteur n'a besoin de rien d'autre
          cp outils/verifier_lot.py publication/verifier_lot.py

          cd publication
          git config user.name  "veilleur-b"
          git config user.email "veilleur-b@users.noreply.github.com"
          git add -A
          git commit -q -m "veilleur b — $HORO — $VERDICT" || echo "rien à committer"
          for essai in 1 2 3; do
            git push origin HEAD:attestations && break
            echo "poussée refusée (essai $essai) — je récupère et je recommence"
            git fetch origin attestations && git rebase origin/attestations || true
            sleep 5
          done

      - name: Barrière — un contrôle rouge fait échouer le job
        if: always()
        run: |
          if [ ! -f lot/JUGEMENT.json ]; then
            echo "::error title=veilleur b::aucun jugement produit : le montage n'a pas pu démarrer (sceau, secrets, configuration). Rien n'a été lu sur la chaîne."
            exit 1
          fi
          python3 - <<'PYEOF'
          import json, sys
          d = json.load(open("lot/JUGEMENT.json", encoding="utf-8"))
          if d["verdict"] == "VERT":
              print(f"VERT — {d['tache']} passe {(d.get('battement') or {}).get('passe')}")
              for r in d.get("remarques") or []:
                  print(f"  remarque : {r}")
              sys.exit(0)
          for m in d["motifs"]:
              print(f"::error title=veilleur b {m['cle']}::{m['texte']}")
          sys.exit(1)
          PYEOF
