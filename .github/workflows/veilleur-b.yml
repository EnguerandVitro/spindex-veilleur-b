# SPINDEX — veilleur, instance « b », sur une infrastructure indépendante de la machine du keeper.
#
# La décision du 2026-09-21 exige DEUX veilleurs, le second sur un autre fournisseur et un autre
# compte. L'instance « a » tourne sur la machine du keeper : si cette machine tombe ou est compromise,
# le témoin tombe avec elle. Ce job est le témoin qui ne tombe pas avec elle.
#
# Ce que ce montage NE protège PAS est écrit dans le README, en tête. Le lire d'abord.
#
# ------------------------------------------------------------------------------------ la cadence
# `schedule` de GitHub Actions ne descend pas sous 5 minutes, et ses exécutions sont au MIEUX
# approximatives : GitHub annonce lui-même des retards, et des passages SAUTÉS en période de charge.
# Un `*/5` ne serait donc pas « toutes les 5 minutes », ce serait « toutes les 5 à 25 minutes ».
#
# `*/15`, et voici pourquoi c'est le bon choix plutôt qu'un compromis :
#   — ce que `b` doit garantir n'est PAS la règle des 5 minutes de publication d'une table. Celle-là
#     appartient à `a`, sous systemd, sur une machine que nous tenons, avec un timer qui tient
#     réellement ses 5 minutes. `b` garantit qu'un silence ou un mensonge de `a` se VOIE ;
#   — l'échelle des choses que `b` doit voir est la semaine (`postWeek`), et les échéances du contrat
#     sont à J+30 et J+90. Un quart d'heure est sans commune mesure avec ces bornes ;
#   — `*/15` donne trois fois plus de marge face aux retards de la plateforme, et divise par trois la
#     charge RPC d'un veilleur qui n'a pas de nœud à lui.
#
# ⚠️ NON RÉSOLU ICI, et pas résoluble ici : le `health.json` que `b` publie est écrit par le paquet
# SCELLÉ, dont `battement.TACHES["passe"]["période_s"]` vaut 300 s en dur (la cadence du timer
# systemd). La surveillance en dérive `silence_max_s ≈ 431 s` et déclarera `b` MUET à chaque passage.
# Voir `DEMANDE-SURVEILLANCE.md`, point 3.
#
# ------------------------------------------------------------------------- ce que le job publie
# Les deux, et chacun pour une raison différente :
#   — un ARTEFACT, attaché à l'exécution : il survit à un échec de poussée, il porte les journaux
#     bruts, et il est là même quand la branche ne l'est pas. Il expire (90 jours) et il faut un
#     compte pour le lire : il ne peut donc pas être le canal de la surveillance. C'est le FILET ;
#   — un COMMIT sur la branche `attestations` : permanent, horodaté par GitHub, lisible par un simple
#     `git fetch` depuis n'importe où, sans compte ni jeton si le dépôt est public. C'est le CANAL.
#
# ------------------------------------------------------------------------------- l'échec du job
# Le paquet scellé sort 0 quand une passe a fait son travail, MÊME si elle a trouvé une P0 : c'est
# juste pour un service surveillé en continu, faux ici, où le seul signal que quelqu'un regarde est
# la croix rouge. `outils/juger.py` traduit, et la barrière finale fait échouer le job — APRÈS avoir
# publié, jamais avant (un veilleur qui se tait quand il trouve quelque chose est pire qu'absent).

name: veilleur-b
# Le NOM de chaque exécution est EXACTEMENT le nom de tâche de l'index des battements (`passe`,
# `differentiel-quotidien`, `differentiel-complet`) : le déclencheur juge la conclusion du dernier run PAR TÂCHE — sans
# cela, un `differentiel-complet` en échec serait masqué par la `passe` réussie suivante. Un run planifié (cron, sans
# `inputs`) est une `passe`.
run-name: ${{ inputs.tache || 'passe' }}

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      tache:
        description: "Tâche à exécuter"
        type: choice
        default: passe
        options: [passe, differentiel-quotidien, differentiel-complet]

# Jamais deux exécutions en parallèle : elles se disputeraient la branche et, pire, le compteur de
# passe (qui doit être strictement croissant) et le verrou du cache des journaux.
# Décidé le 2026-09-29 (atelier veilleur) : PAS de groupe par tâche. Deux tâches parallèles partiraient du MÊME
# `etat/` restauré et publieraient chacune `etat/` EN ENTIER (cache des journaux, points de reprise, health.json) :
# la seconde poussée écraserait les écritures de la première — un rebase ne réconcilie pas deux curseurs de cache
# divergents. Le prix, écrit au README : une `passe` peut attendre la fin d'un `differentiel-complet` (≤ 45 min).
concurrency:
  group: veilleur-b
  cancel-in-progress: false

permissions:
  contents: write        # pousser la branche `attestations`. Rien d'autre.

jobs:
  veiller:
    runs-on: ubuntu-24.04
    timeout-minutes: 45          # un amorçage à froid relit toute la chaîne ; une passe tiède dure quelques secondes
    steps:
      - name: Dépôt
        # épinglé par EMPREINTE (limite n°7 du README) : une étiquette peut être redirigée, un commit non.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0 (= v4 au 2026-09-28)
        with:
          fetch-depth: 1
          # AUCUN identifiant sur le disque pendant que le code qui lit la chaîne tourne : le jeton n'est
          # posé que dans l'étape « Publier », sur l'arbre `publication`, juste avant la poussée.
          persist-credentials: false

      - name: Dépendances épinglées
        # Python 3.12 est celui du runner ubuntu-24.04 : pas d'action tierce de plus pour l'installer.
        # `--require-hashes` : une roue substituée est refusée. `--no-deps` : rien qui ne soit écrit
        # dans requirements.txt n'est installé.
        run: |
          python3 -VV
          python3 -m pip install --user --no-deps --require-hashes -r requirements.txt
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Restaurer l'état depuis la branche `attestations`
        # Une seule branche de données, et elle n'est jamais réécrite : c'est ce qui permet de
        # constater après coup qu'un lot a été publié — ou qu'il manque. L'état de travail (cache des
        # journaux compris) y vit aussi : le perdre ne serait pas grave (il se reconstruit depuis la
        # chaîne) mais ce serait long, et le registre d'amorçage, lui, est l'ancre de chaîne.
        run: |
          bash outils/branche.sh attestations publication
          mkdir -p travail/etat
          if [ -d publication/etat ]; then
            cp -r publication/etat/. travail/etat/
            echo "état restauré :"; ls -la travail/etat
          else
            echo "aucun état dans la branche : premier passage, le job va amorcer depuis la chaîne"
          fi

      - name: Veiller
        id: veille
        continue-on-error: true       # la publication doit avoir lieu même quand le jugement est ROUGE
        # borné SOUS les 45 min du job : Artefact, Publier et Barrière doivent garder ≥ 8 min, sinon un
        # amorçage long tuerait le job avant que l'état partiel ne soit sauvé. Les différentiels (et la preuve D
        # d'un amorçage) s'arrêtent PROPREMENT avant, à `budget_veiller_s` (config, 1 740 s) compté depuis le
        # début de cette étape, et reprennent au job suivant (veilleur/segments.py).
        timeout-minutes: 36
        env:
          B_ETAT: ${{ github.workspace }}/travail
          B_LOT: ${{ github.workspace }}/lot
          B_TACHE: ${{ inputs.tache || 'passe' }}
          B_CONFIG: ${{ github.workspace }}/config/chaine-46630.json
          SPINDEX_B_RPC_URL: ${{ secrets.SPINDEX_B_RPC_URL }}
          SPINDEX_B_ATTEST_KEY_HEX: ${{ secrets.SPINDEX_B_ATTEST_KEY_HEX }}
        run: bash outils/executer.sh

      - name: Artefact (filet, même en échec)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2 (= v4 au 2026-09-28)
        with:
          name: veilleur-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: lot
          if-no-files-found: warn
          retention-days: 90

      - name: Publier sur la branche `attestations`
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -f travail/CACHE_CONTREDIT ]; then
            # KE#151 : un cache CONTREDIT que executer.sh n'a pas pu écarter reste dans travail/etat — rien n'est
            # publié (ni état, ni lot adossé à cet état) : chaque job suivant le reprendrait et refuserait
            echo "::error title=veilleur b::publication BLOQUÉE : cache de journaux CONTREDIT resté dans etat/ (CACHE_CONTREDIT) ; intervention humaine"
            exit 1
          fi
          if [ ! -f lot/MANIFESTE.json ]; then
            # Pas de lot signé. Mais un amorçage interrompu a pu figer des segments de journaux : on les
            # sauve (non signés, et le commit le dit) pour que le job suivant REPRENNE au lieu de repartir
            # du bloc de déploiement. La barrière, plus bas, fait quand même échouer le job.
            git -C publication config user.name  "veilleur-b"
            git -C publication config user.email "veilleur-b@users.noreply.github.com"
            EP=0
            bash outils/etat_partiel.sh travail publication || EP=$?
            case "$EP" in
              0) git -C publication remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
                 bash outils/pousser.sh publication "état partiel"
                 echo "::warning title=veilleur b::aucun lot signé — état PARTIEL d'amorçage sauvé pour reprise" ;;
              3) echo "::warning title=veilleur b::aucun lot signé à publier — rien n'a été figé sur la chaîne" ;;
              *) echo "::error title=veilleur b::sauvegarde de l'état partiel en ÉCHEC (code $EP) — le job suivant repartira du déploiement"
                 exit 1 ;;
            esac
            exit 0
          fi
          VERDICT="$(python3 -B -c 'import json;print(json.load(open("lot/JUGEMENT.json",encoding="utf-8"))["verdict"])')"
          HORO="$(date -u +%Y%m%dT%H%M%SZ)"
          JOUR="${HORO%%T*}"

          # `courant/` : le dernier lot, à un chemin STABLE. C'est ce que la surveillance lit.
          rm -rf publication/courant && mkdir -p publication/courant
          cp -r lot/. publication/courant/

          # `lots/` : l'histoire. On n'archive PAS les 96 passages verts d'une journée — la branche
          # grossirait pour rien. On archive ce qui compte : tout rouge, tout lot portant un verdict
          # de feu vert, et un lot par jour pour prouver que la chaîne des jours n'a pas de trou.
          ARCHIVER=non
          [ "$VERDICT" = "ROUGE" ] && ARCHIVER=oui
          [ -d lot/verdicts ] && ARCHIVER=oui
          ls -d publication/lots/"$JOUR"T* >/dev/null 2>&1 || ARCHIVER=oui
          if [ "$ARCHIVER" = "oui" ]; then
            mkdir -p "publication/lots/$HORO-${GITHUB_RUN_ID}"
            cp -r lot/. "publication/lots/$HORO-${GITHUB_RUN_ID}/"
          fi

          # l'état de travail, pour l'exécution suivante — jamais un fichier de type secret, ni un verrou
          # ou un fichier temporaire d'écriture atomique interrompue (sans valeur hors de la machine)
          bash outils/etat_sain.sh travail/etat
          rm -rf publication/etat && mkdir -p publication/etat
          cp -r travail/etat/. publication/etat/
          find publication/etat \( -name '*.verrou' -o -name '.verrou' -o -name '*.tmp' \) -type f -delete
          # le vérificateur voyage avec les lots : un lecteur n'a besoin de rien d'autre
          cp outils/verifier_lot.py publication/verifier_lot.py

          git -C publication config user.name  "veilleur-b"
          git -C publication config user.email "veilleur-b@users.noreply.github.com"
          git -C publication add -A
          git -C publication commit -q -m "veilleur b — $HORO — $VERDICT" || echo "rien à committer"
          # le jeton n'est posé qu'ICI (persist-credentials: false au checkout)
          git -C publication remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          # échoue (1) si le lot n'est pas publié après 3 essais — jamais un step vert muet (KE#105)
          bash outils/pousser.sh publication "lot"

      - name: Barrière — un contrôle rouge fait échouer le job
        if: always()
        run: |
          if [ ! -f lot/JUGEMENT.json ]; then
            if [ ! -f travail/ARRET.json ] && [ -f travail/JUGEMENT.json ]; then
              # le jugement EXISTE : c'est la fabrication ou la revérification du lot qui a échoué, pas la lecture
              python3 -B -c 'import json;j=json.load(open("travail/JUGEMENT.json",encoding="utf-8"));print("::error title=veilleur b lot non publié::jugement %s produit (tâche %s), mais le lot n a pas pu être fabriqué ou revérifié (publier.py / verifier_lot.py) — voir l étape « Veiller »." % (j.get("verdict"), j.get("tache")))'
              exit 1
            fi
            if [ ! -f travail/ARRET.json ] && [ -f travail/ETAPE.json ]; then
              # « Veiller » tué (délai du job, runner coupé) PENDANT une étape qui lit la chaîne : le dire tel quel,
              # jamais « rien n'a été lu » (les points de reprise figés sont sauvés par l'état partiel)
              python3 -B -c 'import json;e=json.load(open("travail/ETAPE.json",encoding="utf-8"));print("::error title=veilleur b interrompu::« Veiller » interrompu pendant l étape « %s » (commencée à %s) — délai du job ou runner coupé ; la chaîne A été lue, les points de reprise figés ont été sauvés en état partiel s il y en avait." % (e["étape"], e["début"]))'
              exit 1
            fi
            if [ -f travail/ARRET.json ] && python3 -B -c 'import json,sys;sys.exit(0 if json.load(open("travail/ARRET.json",encoding="utf-8"))["code"]==20 else 1)'; then
              # amorçage EN COURS (paquet : sortie 20) : figeage C ou preuve D arrêtés PROPREMENT à l'échéance, repris
              # au job suivant — pas un refus. Le job reste en échec (aucun registre, aucun lot signé), nommé tel quel.
              python3 -B -c 'import json;a=json.load(open("travail/ARRET.json",encoding="utf-8"));print("::error title=veilleur b amorçage EN COURS::amorçage EN COURS, repris au job suivant (différentiel complet : %s ; journaux figés jusqu au bloc %s). Aucun lot signé tant qu il n est pas AMORCÉ ; l état partiel est sauvé." % (a["différentiel_D"] or "non atteint", a["journaux_figés_jusqu_à"]))'
              exit 1
            fi
            if [ -f travail/ARRET.json ]; then
              # amorçage interrompu : la chaîne A été lue, et le message doit le dire exactement
              python3 -B -c 'import json;a=json.load(open("travail/ARRET.json",encoding="utf-8"));print("::error title=veilleur b amorçage::amorçage interrompu (code %s) — différentiel complet : %s ; journaux figés jusqu au bloc %s. Aucun lot signé ; l état partiel a été sauvé si des segments étaient figés, et le job suivant reprend là." % (a["code"], a["différentiel_D"] or "non atteint", a["journaux_figés_jusqu_à"]))'
            else
              echo "::error title=veilleur b::aucun jugement produit : le montage n'a pas pu démarrer (sceau, secrets, configuration). Rien n'a été lu sur la chaîne."
            fi
            exit 1
          fi
          python3 - <<'PYEOF'
          import json, sys
          d = json.load(open("lot/JUGEMENT.json", encoding="utf-8"))
          if d["verdict"] == "VERT":
              print(f"VERT — {d['tache']} passe {(d.get('battement') or {}).get('passe')}")
              for r in d.get("remarques") or []:
                  print(f"  remarque : {r}")
              sys.exit(0)
          if d["verdict"] == "EN_COURS":
              # jamais VERT, jamais muet : un avertissement nommé, et le lot publié porte « EN_COURS »
              print(f"::warning title=veilleur b différentiel en cours::{d['en_cours']}")
              sys.exit(0)
          for m in d["motifs"]:
              print(f"::error title=veilleur b {m['cle']}::{m['texte']}")
          sys.exit(1)
          PYEOF

# (ligne ajoutée pour forcer l’enregistrement du workflow : GitHub n’avait pas indexé ce fichier
#  lors du tout premier envoi qui a créé le dépôt — le contenu, lui, était valide.)
